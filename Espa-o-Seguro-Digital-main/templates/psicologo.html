<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel do Psicólogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <aside class="sidebar">

        <div class="sidebar-logo">
            ESDI
        </div>

        
        <div class="sidebar-profile">
            <div class="profile-pic">
                <i class="fa-solid fa-user" style="color: #ccc;"></i>
            </div>
            <div class="profile-name">
                <span style="color: #fff;">{{ session['usuario'] }}</span><br>
                {{ session['campus'] }}
            </div>
        </div>

        <ul class="sidebar-menu">
            <li><a href="{{ url_for('psicologo_agendamentos') }}"><i class="fa-solid fa-handshake-angle"></i> AGENDAMENTOS</a></li>
            <li><a href="{{ url_for('objetivo') }}"><i class="fa-solid fa-bullseye"></i> OBJETIVO DO SITE</a></li>            
            <li style="margin-top: auto;">
                <a href="{{ url_for('logout') }}" class="menu-sair"><i class="fa-solid fa-power-off"></i> SAIR</a>
            </li>
        </ul>
    </aside>

    <main class="conteudo-principal">

        <!-- IMAGEM NO TOPO -->
        <div style="width: 100%; margin-bottom: 40px;">
            <img 
                src="/static/imagens/Imagem_tela.jpeg" 
                alt="ESDI - Espaço Seguro Digital" 
                style="
                    width: 100%;
                    max-height: 260px;
                    object-fit: cover;
                    border-radius: 12px;
                    display: block;
                "
            >
        </div>

        <!-- ATENDIMENTO PSICOLÓGICO -->
        <div class="secao-titulo">
            <i class="fa-solid fa-user-doctor"></i> ATENDIMENTO PSICOLÓGICO
        </div>

        <div>
        <div style="display: flex; gap: 30px; flex-wrap: wrap;">

            <a href="{{ url_for('psicologo_agendamentos') }}" class="card-suap">
                <i class="fa-solid fa-clipboard-list card-icon"></i>
                <span class="card-title">Agendamentos</span>
            </a>


            <a href="{{ url_for('psicologo_historico') }}" class="card-suap">
                <i class="fa-solid fa-clock-rotate-left card-icon"></i>
                <span class="card-title">Histórico de Consultas</span>
            </a>

            <a href="{{ url_for('ajuda') }}" class="card-suap" style="width:500px;">
                <i class="fa-solid fa-phone card-icon"></i>
                <span class="card-title">Meios de contato</span>
            </a>
        </div>

        <!-- DICAS DE SAÚDE -->
        <div class="secao-titulo" style="margin-top: 40px;">
            <i class="fa-solid fa-lightbulb"></i> DICAS DE SAÚDE
        </div>

        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
            <a href="{{ url_for('psicologo_dicas') }}" class="card-suap">
                <i class="fa-solid fa-pen-to-square card-icon"></i>
                <span class="card-title">Publicar Dica</span>
            </a>

        </div>

    </main>

</body>
</html>
</body>
</html>
