<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">ESDI</div>
        
        <div class="sidebar-profile">
            <div class="profile-pic">
                <i class="fa-solid fa-user" style="color: #ccc;"></i>
            </div>
            <div class="profile-name">
                <span style="color: #c9d8f0; font-size: 12px;">Bem-vindo(a),</span><br>
                <b style="color: #fff; font-size: 14px;">{{ session['nome'] }}</b><br>
                <small style="color: #c9d8f0; margin-top: 3px; display: inline-block;">
                    <i class="fa-solid fa-graduation-cap"></i> Campus {{ session['campus'] }}
                </small>
            </div>
        </div>

        <ul class="sidebar-menu">
            <li><a href="{{ url_for('area_aluno') }}"><i class="fa-solid fa-house"></i> INÍCIO</a></li>
            <li><a href="{{ url_for('agenda') }}"><i class="fa-regular fa-calendar-plus"></i> MINHA AGENDA</a></li>
            <li><a href="{{ url_for('consultas') }}"><i class="fa-solid fa-user-group"></i> AGENDAR CONSULTA</a></li>
            <li><a href="{{ url_for('ajuda') }}"><i class="fa-solid fa-handshake-angle"></i> PROCURAR AJUDA</a></li>
            <li style="margin-top: auto;">
                <a href="{{ url_for('logout') }}" class="menu-sair"><i class="fa-solid fa-power-off"></i> SAIR</a>
            </li>
        </ul>
    </aside>

    <main class="conteudo-principal">
        <h2 class="secao-titulo"><i class="fa-solid fa-user-group"></i> AGENDAR NOVA CONSULTA</h2>
        
        <!-- Mensagem de aviso para o professor/usuário de que a funcionalidade está na próxima fase -->
        <p style="color: #666; margin-bottom: 30px;">
            A funcionalidade de seleção de modalidade e profissional será implementada na próxima fase do projeto.
        </p>
        
        <div class="card" style="max-width: 500px; margin-top: 0;">
            <!-- O formulário está desativado temporariamente -->
            <form action="#" method="POST" onsubmit="return false;">
                
                <label>1. Escolha a Modalidade:</label>
                <!-- Select desativado e com cor cinza -->
                <select id="tipoConsulta" name="modalidade" disabled style="background-color: #f0f0f0;">
                    <option value="" disabled selected>Disponível na próxima etapa...</option>
                </select>

                <label>2. Escolha o Profissional:</label>
                <!-- Select desativado e com cor cinza -->
                <select name="psicologo" id="selectPsicologo" disabled style="background-color: #f0f0f0;">
                    <option value="" disabled selected>Em breve...</option>
                </select>

                <!-- Botão desativado e sem ação -->
                <button type="button" disabled style="background-color: #ccc; cursor: not-allowed;">
                    Ver Horários Disponíveis
                </button>
            </form>
        </div>
    </main>

    <!-- O Script foi removido temporariamente para esta fase visual -->
</body>
</html>
