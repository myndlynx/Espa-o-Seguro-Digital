<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login - Espaço Seguro Digital</title>
    <style>
        :root {
            --cor-primaria: #017193;
            --cor-primaria-escura: #015a77;
            --cor-secundaria: #708fbd;
            --cor-secundaria-escura: #4772b3;
            --cor-fundo: #f4f7f6;
            --cor-sucesso: #28a745;
            --cor-erro: #dc3545;
            --cor-texto: #333333;
            --cor-texto-claro: #666666;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ===== Card ocupa a tela inteira ===== */
        .login-card {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        /* ===== Cabeçalho colorido ===== */
        .login-header {
            position: relative;
            flex: 0 0 auto;
            padding: 40px 30px 60px 30px;
            background: linear-gradient(150deg, var(--cor-secundaria) 0%, var(--cor-primaria) 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
        }

        .blob-1 {
            width: 160px;
            height: 160px;
            top: -60px;
            left: -60px;
        }

        .blob-2 {
            width: 90px;
            height: 90px;
            top: 20px;
            left: 90px;
            background: rgba(255, 255, 255, 0.08);
        }

        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
        }

        .login-logo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }

        .login-header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            position: relative;
            z-index: 2;
        }

        .login-header p {
            margin: 6px 0 0 0;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            opacity: 0.95;
            position: relative;
            z-index: 2;
        }

        .planta {
            position: absolute;
            right: 18px;
            bottom: -18px;
            width: 90px;
            z-index: 1;
            opacity: 0.95;
        }

        /* ===== Corpo do formulário ===== */
        .login-body {
            position: relative;
            flex: 1 1 auto;
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            margin-top: -30px;
            padding: 32px 28px 40px 28px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-body h2 {
            margin: 0 0 20px 0;
            font-size: 26px;
            font-weight: 800;
            color: var(--cor-primaria-escura);
        }

        .form-login {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .campo {
            position: relative;
        }

        .campo svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--cor-secundaria);
            fill: none;
            pointer-events: none;
        }

        .campo input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            font-size: 15px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .campo input:focus {
            border-color: var(--cor-primaria);
            box-shadow: 0 0 0 3px rgba(1, 113, 147, 0.15);
            background: #ffffff;
        }

        .campo.senha input {
            padding-right: 42px;
        }

        .botao-olho {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
        }

        .botao-olho svg {
            position: static;
            width: 18px;
            height: 18px;
            stroke: var(--cor-texto-claro);
            fill: none;
        }

        .info-senha {
            align-self: flex-end;
            font-size: 13px;
            color: var(--cor-primaria);
            text-decoration: none;
            font-weight: 600;
            margin-top: -4px;
        }

        .info-senha:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: var(--cor-primaria);
            color: #ffffff;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            margin-top: 6px;
        }

        .btn-login:hover {
            background: var(--cor-primaria-escura);
            transform: translateY(-1px);
        }

        .erro-msg {
            background: rgba(220, 53, 69, 0.1);
            color: var(--cor-erro);
            font-weight: 600;
            font-size: 13px;
            margin: 0;
            padding: 10px 12px;
            border-radius: 10px;
            text-align: center;
        }

        .rodape-login {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: var(--cor-texto-claro);
        }

        /* ===== Layout para computador / notebook ===== */
        @media (min-width: 860px) {
            .login-card {
                flex-direction: row;
            }

            .login-header {
                flex: 0 0 45%;
                padding: 60px 50px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .login-logo {
                justify-content: flex-start;
                margin-bottom: 24px;
            }

            .login-header h1 {
                font-size: 42px;
            }

            .login-header p {
                font-size: 15px;
                max-width: 280px;
            }

            .planta {
                width: 140px;
                right: 40px;
                bottom: 40px;
            }

            .login-body {
                flex: 1 1 55%;
                margin-top: 0;
                border-radius: 0;
                padding: 60px 80px;
            }

            .login-body h2 {
                font-size: 32px;
            }

            .form-login {
                max-width: 380px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">

        <div class="login-header">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>

            <div class="login-logo">
                <img src="{{ url_for('static', filename='imagens/logo.jpeg') }}" alt="Logo ESDI">
            </div>

            <h1>Olá!</h1>
            <p>SEJA BEM-VINDO(A) AO ESPAÇO SEGURO DIGITAL</p>

            <svg class="planta" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="50" cy="112" rx="26" ry="5" fill="rgba(0,0,0,0.08)"/>
                <path d="M28 82 L72 82 L66 112 L34 112 Z" fill="#ffffff"/>
                <path d="M50 82 C 30 60, 30 30, 46 8 C 40 40, 46 65, 50 82 Z" fill="#28a745" opacity="0.85"/>
                <path d="M50 82 C 70 55, 66 25, 50 4 C 60 35, 56 65, 50 82 Z" fill="#28a745"/>
            </svg>
        </div>

        <div class="login-body">
            <h2>Login</h2>

            <form method="POST" action="/login" class="form-login">

                {% if erro %}
                    <p class="erro-msg">{{ erro }}</p>
                {% endif %}

                <div class="campo">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="7" width="18" height="13" rx="2"></rect>
                        <path d="M3 7l9 6 9-6"></path>
                    </svg>
                    <input
                        type="text"
                        name="matricula"
                        placeholder="Matrícula"
                        required
                        pattern="[0-9]+"
                        title="A matrícula deve conter apenas números"
                    >
                </div>

                <div class="campo senha">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    </svg>
                    <input
                        type="password"
                        name="senha"
                        id="campo-senha"
                        placeholder="Senha"
                        required
                    >
                    <button type="button" class="botao-olho" id="botao-olho" aria-label="Mostrar senha">
                        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <a href="https://suap.ifpb.edu.br/comum/solicitar_trocar_senha/" class="info-senha">
                    Esqueceu a senha?
                </a>

                <button type="submit" class="btn-login">Acessar</button>
            </form>

            <p class="rodape-login">Espaço Seguro Digital &middot; IFPB</p>
        </div>
    </div>

    <script>
        var botaoOlho = document.getElementById('botao-olho');
        var campoSenha = document.getElementById('campo-senha');

        botaoOlho.addEventListener('click', function () {
            var mostrando = campoSenha.getAttribute('type') === 'text';
            campoSenha.setAttribute('type', mostrando ? 'password' : 'text');
            botaoOlho.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
        });
    </script>
</body>
</html>
