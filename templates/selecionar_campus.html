<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Campus</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("{{ url_for('static', filename='imagens/fundinho.jpeg.png') }}");
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .quadrado {
            width: 500px;
            background-color: rgb(165, 255, 252);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            /* Define uma altura máxima para a caixa não vazar na tela */
            max-height: 85vh; 
            display: flex;
            flex-direction: column;
        }
        h2 { 
            color: #017193; 
            margin-bottom: 20px; 
            margin-top: 0;
        }
        
        /* ESTILOS DA BARRA DE PESQUISA */
        .barra-pesquisa {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #00bbd8;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .barra-pesquisa:focus {
            border-color: #006080;
            box-shadow: 0 0 5px rgba(0, 187, 216, 0.5);
        }

        /* ESTILOS DA LISTA ROLÁVEL */
        .opcoes-lista {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            /* Faz a lista ter rolagem (scroll) se ficar muito grande */
            overflow-y: auto; 
            padding-right: 10px;
            flex-grow: 1;
        }

        /* Personalizando a barrinha de rolagem (Scrollbar) */
        .opcoes-lista::-webkit-scrollbar { width: 8px; }
        .opcoes-lista::-webkit-scrollbar-track { background: #e0faff; border-radius: 10px; }
        .opcoes-lista::-webkit-scrollbar-thumb { background: #00bbd8; border-radius: 10px; }

        .campus-label {
            width: 100%;
            display: block;
        }
        .campus-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        input[type="radio"] { display: none; }

        input[type="radio"]:checked + .campus-item {
            background: #00bbd8;
            color: white;
            border-color: #006080;
            transform: scale(1.02);
        }

        .campus-item:hover {
            background: #e0faff;
            border-color: #00bbd8;
        }

        .btn-confirmar {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #00bbd8;
            color: white;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-confirmar:hover { background: #006080; }
    </style>
</head>
<body>
    <div class="quadrado">
        <h2>Selecionar Campus</h2>
        
        <input type="text" id="inputPesquisa" class="barra-pesquisa" placeholder="Digite para buscar seu campus..." onkeyup="filtrarCampi()">

        <form action="/salvar-campus" method="POST" style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;">
            
            <div class="opcoes-lista" id="listaCampi">
                {% for c in campi %}
                <label class="campus-label">
                    <input type="radio" name="campus_nome" value="{{ c.nome }}" required>
                    <div class="campus-item">{{ c.nome }}</div>
                </label>
                {% endfor %}
            </div>
            
            <button type="submit" class="btn-confirmar">Confirmar Seleção</button>
        </form>
    </div>

    <script>
        function filtrarCampi() {
            // Pega o que foi digitado e converte para letras minúsculas
            let input = document.getElementById('inputPesquisa');
            let filtro = input.value.toLowerCase();
            
            // Pega todos os itens da lista
            let lista = document.getElementById('listaCampi');
            let labels = lista.getElementsByClassName('campus-label');

            // Passa por cada item da lista conferindo o nome
            for (let i = 0; i < labels.length; i++) {
                let nomeCampus = labels[i].innerText || labels[i].textContent;
                
                // Se o nome do campus tiver as letras digitadas, ele aparece, senão, ele some
                if (nomeCampus.toLowerCase().indexOf(filtro) > -1) {
                    labels[i].style.display = "";
                } else {
                    labels[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
